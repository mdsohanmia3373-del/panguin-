<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PENGUIN PRO</title>
<script>
function ld(b){var s=document.createElement('script');s.src=atob(b);document.head.appendChild(s);}
ld("aHR0cHM6Ly91bnBrZy5jb20vaHRtbDUtcXJjb2RlQDIuMy44L2h0bWw1LXFyY29kZS5taW4uanM=");
ld("aHR0cHM6Ly91bnBrZy5jb20vcGVlcmpzQDEuNS4yL2Rpc3QvcGVlcmpzLm1pbi5qcw==");
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#000;color:#fff;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{position:fixed;top:0;width:100%;padding:12px 15px;background:#111;display:flex;justify-content:space-between;align-items:center;z-index:100;border-bottom:1px solid #222}
.logo{font-size:18px;font-weight:bold}
.logo span{background:#f00;padding:2px 6px;border-radius:4px;font-size:12px}
.id-badge{background:#222;padding:5px 10px;border-radius:20px;font-size:12px;color:#0f8;border:1px solid #333;cursor:pointer}
.screen{display:none;flex:1;height:calc(100vh - 60px);overflow-y:auto;padding:55px 0 70px}
.screen.active{display:block}
#shortsScreen{padding:0;scroll-snap-type:y mandatory;overflow-y:scroll}
.short-card{height:calc(100vh - 60px);width:100%;scroll-snap-align:start;background:#111}
.short-card iframe{width:100%;height:100%;border:none}
.add-btn{position:fixed;top:65px;right:15px;background:#f00;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;z-index:90}
.card{background:#161616;margin:15px;padding:15px;border-radius:12px;border:1px solid #2a2a2a}
.btn{background:#f00;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:bold;width:100%;margin-top:8px}
input{width:100%;padding:10px;background:#222;border:1px solid #444;color:#fff;border-radius:8px;margin-top:8px}
.c-item{display:flex;justify-content:space-between;align-items:center;background:#222;padding:10px;border-radius:8px;margin-top:8px}
.chat-hdr{background:#1a1a1a;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}
.msgs{height:calc(100vh - 235px);overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:10px 14px;border-radius:15px;font-size:14px}
.sent{background:#f00;align-self:flex-end}
.received{background:#262626;align-self:flex-start}
.chat-bar{position:fixed;bottom:60px;width:100%;background:#161616;padding:8px;display:flex;gap:8px}
.chat-bar input{margin:0;flex:1}
.chat-bar button{width:auto;margin:0;padding:0 16px}
#callBox{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:20px}
video{width:100%;max-width:350px;border-radius:12px;background:#222}
#localVid{width:100px;position:absolute;top:20px;right:20px;border:2px solid #f00}
.nav{position:fixed;bottom:0;width:100%;height:60px;background:#111;border-top:1px solid #222;display:flex;z-index:100}
.nav div{color:#888;text-align:center;font-size:12px;flex:1;padding:10px 0;cursor:pointer}
.nav .active{color:#f00;font-weight:bold}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🐧 PENGUIN <span>PRO</span></div>
  <div class="id-badge" onclick="copyId()" id="myId">ID লোড হচ্ছে...</div>
</div>
<div id="shortsScreen" class="screen active">
  <button class="add-btn" onclick="addShort()">+ Shorts</button>
  <div id="shortsList">
    <div class="short-card"><iframe id="v1" allowfullscreen></iframe></div>
    <div class="short-card"><iframe id="v2" allowfullscreen></iframe></div>
  </div>
</div>
<div id="scanScreen" class="screen">
  <div class="card" style="text-align:center">
    <h3>আপনার QR ও ID</h3>
    <img id="qrImg" style="width:140px;height:140px;margin:10px auto;background:#fff;padding:5px;border-radius:8px">
    <p id="fullId" style="color:#0f8;font-weight:bold"></p>
  </div>
  <div class="card">
    <button class="btn" style="background:#2979ff" onclick="scanQR()">📷 QR স্ক্যান করুন</button>
    <div id="reader"></div>
    <input id="fName" placeholder="বন্ধুর নাম">
    <input id="fId" placeholder="বন্ধুর ID (PNG-xxxxxx)">
    <button class="btn" style="background:#00c853" onclick="saveContact()">কন্টাক্ট সেভ করুন</button>
  </div>
  <div class="card"><h3>কন্টাক্ট লিস্ট</h3><div id="cList"></div></div>
</div>
<div id="chatScreen" class="screen">
  <div class="chat-hdr">
    <div><strong id="chatName">কাউকে সিলেক্ট করুন</strong><div id="chatId" style="font-size:11px;color:#0f8"></div></div>
    <div>
      <button onclick="callUser(false)" style="background:#00c853;border:none;color:#fff;padding:6px 10px;border-radius:6px">📞</button>
      <button onclick="callUser(true)" style="background:#2979ff;border:none;color:#fff;padding:6px 10px;border-radius:6px">📹</button>
    </div>
  </div>
  <div class="msgs" id="msgBox"></div>
  <div class="chat-bar">
    <input id="msgIn" placeholder="মেসেজ লিখুন...">
    <button class="btn" onclick="sendMsg()">পাঠান</button>
  </div>
</div>
<div id="callBox">
  <h3 id="callStat">কল হচ্ছে...</h3>
  <video id="remVid" autoplay playsinline></video>
  <video id="localVid" autoplay muted playsinline></video>
  <button class="btn" style="max-width:180px;margin-top:15px" onclick="endCall()">কল কাটুন</button>
</div>
<div class="nav">
  <div class="active" onclick="tab('shortsScreen',this)">🎬<br>Shorts</div>
  <div onclick="tab('scanScreen',this)">📷<br>কন্টাক্ট</div>
  <div onclick="tab('chatScreen',this)">💬<br>চ্যাট ও কল</div>
</div>
<script>
var yt = atob("aHR0cHM6Ly93d3cueW91dHViZS5jb20vZW1iZWQv");
document.getElementById('v1').src = yt + "aqz-KE-bpKQ?rel=0";
document.getElementById('v2').src = yt + "LXb3EKWsInQ?rel=0";

var uid = localStorage.getItem('p_uid');
if(!uid){ uid = 'PNG-' + Math.floor(100000 + Math.random()*900000); localStorage.setItem('p_uid', uid); }
document.getElementById('myId').innerText = uid + ' 📋';
document.getElementById('fullId').innerText = uid;
document.getElementById('qrImg').src = atob("aHR0cHM6Ly9hcGkucXJzZXJ2ZXIuY29tL3YxL2NyZWF0ZS1xci1jb2RlLz9zaXplPTE1MHgxNTAmZGF0YT0=") + uid;

var peerUser = null, lStream = null, curCall = null;
function copyId(){ navigator.clipboard.writeText(uid); alert('ID কপি হয়েছে: ' + uid); }
function tab(id, el){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav div').forEach(n=>n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(el) el.classList.add('active');
}
function addShort(){
  var u = prompt('YouTube লিংক দিন:'); if(!u) return;
  var id = u.includes('/shorts/') ? u.split('/shorts/')[1].slice(0,11) : u.includes('youtu.be/') ? u.split('youtu.be/')[1].slice(0,11) : u.includes('v=') ? u.split('v=')[1].slice(0,11) : '';
  if(id.length===11){
    var d = document.createElement('div'); d.className='short-card';
    d.innerHTML = '<iframe src="'+yt+id+'?autoplay=1&rel=0" allowfullscreen></iframe>';
    document.getElementById('shortsList').prepend(d);
  } else alert('সঠিক লিংক দিন!');
}
function saveContact(){
  var n = document.getElementById('fName').value.trim(), i = document.getElementById('fId').value.trim();
  if(!n || !i) return alert('নাম ও ID দিন!');
  var c = JSON.parse(localStorage.getItem('p_contacts')||'[]'); c.push({n:n,i:i});
  localStorage.setItem('p_contacts', JSON.stringify(c));
  document.getElementById('fName').value=''; document.getElementById('fId').value=''; showContacts();
}
function showContacts(){
  var c = JSON.parse(localStorage.getItem('p_contacts')||'[]'), box = document.getElementById('cList');
  box.innerHTML = '';
  c.forEach(x=>{
    box.innerHTML += '<div class="c-item"><div><b>'+x.n+'</b><br><small style="color:#0f8">'+x.i+'</small></div><div><button onclick="openChat(\''+x.n+'\',\''+x.i+'\')" style="background:#f00;border:none;color:#fff;padding:6px 10px;border-radius:6px">চ্যাট</button></div></div>';
  });
}
showContacts();
function scanQR(){
  if(!window.Html5Qrcode) return alert('অপেক্ষা করুন...');
  var qr = new Html5Qrcode("reader");
  qr.start({facingMode:"environment"},{fps:10,qrbox:200}, txt=>{ document.getElementById('fId').value=txt; alert('স্ক্যান সফল: '+txt); qr.stop(); });
}
setTimeout(()=>{
  if(window.Peer){
    window.p = new Peer(uid);
    window.p.on('call', call=>{
      if(confirm('কল আসছে! রিসিভ করবেন?')){
        navigator.mediaDevices.getUserMedia({video:true,audio:true}).then(st=>{
          lStream=st; document.getElementById('localVid').srcObject=st; document.getElementById('callBox').style.display='flex';
          call.answer(st); curCall=call; call.on('stream', r=>document.getElementById('remVid').srcObject=r);
        });
      }
    });
  }
},1500);
function callUser(vid){
  if(!peerUser) return alert('আগে কন্টাক্ট সিলেক্ট করুন!');
  navigator.mediaDevices.getUserMedia({video:vid,audio:true}).then(st=>{
    lStream=st; document.getElementById('localVid').srcObject=st; document.getElementById('callBox').style.display='flex';
    var call = window.p.call(peerUser.i, st); curCall=call;
    call.on('stream', r=>{ document.getElementById('callStat').innerText='কানেক্টেড'; document.getElementById('remVid').srcObject=r; });
  });
}
function endCall(){ if(curCall)curCall.close(); if(lStream)lStream.getTracks().forEach(t=>t.stop()); document.getElementById('callBox').style.display='none'; }
</script>
<script type="module">
try {
  const { initializeApp } = await import(atob("aHR0cHM6Ly93d3cuZ3N0YXRpYy5jb20vZmlyZWJhc2Vqcy8xMC43LjEvZmlyZWJhc2UtYXBwLmpz"));
  const { getDatabase, ref, push, onChildAdded, off } = await import(atob("aHR0cHM6Ly93d3cuZ3N0YXRpYy5jb20vZmlyZWJhc2Vqcy8xMC43LjEvZmlyZWJhc2UtZGF0YWJhc2UuanM="));
  const app = initializeApp({
    apiKey: "AIzaSyCUD-iiLSIFCCvZd44fQQHPpV28CWGynFk",
    authDomain: atob("cGVuZ3Vpbi1wcm8uZmlyZWJhc2VhcHAuY29t"),
    databaseURL: atob("aHR0cHM6Ly9wZW5ndWluLXByby1kZWZhdWx0LXJ0ZGIuZmlyZWJhc2Vpby5jb20="),
    projectId: "penguin-pro",
    appId: "1:548894421868:web:55e304231182dbad3c3949"
  });
  const db = getDatabase(app);
  let cRef = null;
  window.openChat = function(n, i){
    peerUser = {n:n, i:i};
    document.getElementById('chatName').innerText = n;
    document.getElementById('chatId').innerText = i;
    const box = document.getElementById('msgBox'); box.innerHTML = '';
    tab('chatScreen', document.querySelectorAll('.nav div'));
    if(cRef) off(cRef);
    cRef = ref(db, 'chats/' + [uid, i].sort().join('_'));
    onChildAdded(cRef, s=>{
      const d = s.val();
      box.innerHTML += '<div class="msg '+(d.s===uid?'sent':'received')+'">'+d.t+'</div>';
      box.scrollTop = box.scrollHeight;
    });
  };
  window.sendMsg = function(){
    if(!peerUser) return alert('আগে কন্টাক্ট সিলেক্ট করুন!');
    const inp = document.getElementById('msgIn'); if(!inp.value.trim()) return;
    push(ref(db, 'chats/' + [uid, peerUser.i].sort().join('_')), {s:uid, t:inp.value.trim()});
    inp.value = '';
  };
} catch(e){}
</script>
</body>
</html>
